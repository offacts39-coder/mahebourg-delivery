<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#0f766e">

<title>Mahebourg Rider - Admin</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,system-ui,sans-serif;
background:#f4f7f7;
color:#16302d;
}

.app{
max-width:650px;
margin:auto;
min-height:100vh;
}

.header{
background:linear-gradient(135deg,#0f766e,#159a8c);
color:white;
padding:22px 18px;
border-bottom-left-radius:24px;
border-bottom-right-radius:24px;
}

.brand{
font-size:13px;
font-weight:bold;
opacity:.9;
}

.title{
font-size:27px;
font-weight:800;
margin-top:7px;
}

.content{
padding:16px;
}

.card{
background:white;
padding:18px;
border-radius:18px;
margin-bottom:15px;
box-shadow:0 5px 20px #0000000d;
border:1px solid #dce7e5;
}

h3{
margin-top:0;
}

input,
button,
select{
width:100%;
padding:14px;
margin:7px 0;
border-radius:12px;
font-size:15px;
}

input,
select{
border:1px solid #dce7e5;
background:#fff;
}

button{
border:0;
font-weight:bold;
cursor:pointer;
}

.primary{
background:#0f766e;
color:white;
}

.secondary{
background:#e8f5f3;
color:#0f766e;
}

.red{
background:#dc2626;
color:white;
}

.hidden{
display:none !important;
}

.error{
background:#fee2e2;
color:#991b1b;
padding:12px;
border-radius:10px;
font-size:13px;
margin-top:10px;
display:none;
}

.success{
background:#dcfce7;
color:#166534;
padding:12px;
border-radius:10px;
font-size:13px;
margin-top:10px;
display:none;
}

.status{
display:inline-block;
padding:5px 9px;
border-radius:20px;
background:#fff4d8;
color:#8a5a00;
font-weight:bold;
font-size:11px;
}

.order{
border:1px solid #dce7e5;
border-radius:14px;
padding:14px;
margin-top:12px;
background:#fbfdfd;
}

.order-title{
font-size:17px;
font-weight:800;
color:#0f766e;
}

.info{
font-size:13px;
line-height:1.6;
margin-top:8px;
}

.small{
font-size:12px;
color:#6b7d7a;
}

.logout{
margin-top:10px;
}

.rider-row{
display:grid;
grid-template-columns:1fr auto;
gap:8px;
}

.rider-row button{
width:auto;
padding:12px 16px;
}

@media(max-width:420px){

.rider-row{
grid-template-columns:1fr;
}

.rider-row button{
width:100%;
}

}

</style>

</head>


<body>


<div class="app">


<header class="header">

<div class="brand">
MAHEBOURG • GROCERY DELIVERY
</div>

<div class="title">
Admin Dashboard
</div>

</header>


<main class="content">


<!-- ================= LOGIN ================= -->

<section
id="loginView"
class="card">

<h3>
🔐 Admin Login
</h3>

<p class="small">
Login with your authorized admin email and password.
</p>


<input
id="email"
type="email"
placeholder="Admin email"
autocomplete="email"
/>


<input
id="password"
type="password"
placeholder="Password"
autocomplete="current-password"
/>


<button
id="loginButton"
class="primary"
onclick="adminLogin()">

Login

</button>


<div
id="loginError"
class="error">
</div>


</section>



<!-- ================= ADMIN ================= -->

<section
id="adminView"
class="hidden">


<div class="card">

<h3>
👑 Welcome, <span id="adminName">Admin</span>
</h3>

<div class="small">
You are logged in as administrator.
</div>


<button
class="red logout"
onclick="logoutAdmin()">

Logout

</button>

</div>



<!-- ORDERS -->

<div class="card">

<h3>
📦 Orders
</h3>

<div
id="orderCount"
class="small">

Loading orders...

</div>


<div id="orders">
</div>

</div>


</section>


</main>

</div>



<script type="module">


/* =========================================
   FIREBASE IMPORTS
========================================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
getDatabase,
ref,
onValue,
update
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";



/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

apiKey:
"AIzaSyBZzPmYBJNqio_IDrPn6abTVFoci-7GKtI",

authDomain:
"delivery-5d936.firebaseapp.com",

databaseURL:
"https://delivery-5d936-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:
"delivery-5d936",

storageBucket:
"delivery-5d936.firebasestorage.app",

messagingSenderId:
"980186352754",

appId:
"1:980186352754:web:02785a4144fd6f174746eb",

measurementId:
"G-P9ZS24E9Q8"

};


/* =========================================
   INITIALIZE
========================================= */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getDatabase(app);


/* =========================================
   YOUR ADMIN UID LIST
========================================= */

const ADMIN_UIDS = [

"8dxUfisFdudttzHeY5PZNYwyy3O2",

"qMsTb5TZLbRpclihRBnn9jKlOAA2"

];


/* =========================================
   LOGIN
========================================= */

window.adminLogin =
async function(){

const email =
document.getElementById(
"email"
).value.trim();

const password =
document.getElementById(
"password"
).value;


const errorBox =
document.getElementById(
"loginError"
);


const button =
document.getElementById(
"loginButton"
);


errorBox.style.display =
"none";


if(!email || !password){

errorBox.textContent =
"Please enter email and password.";

errorBox.style.display =
"block";

return;

}


button.disabled =
true;

button.textContent =
"Logging in...";


try{

const result =
await signInWithEmailAndPassword(

auth,

email,

password

);


const user =
result.user;


/* CHECK ADMIN UID */

if(
!ADMIN_UIDS.includes(
user.uid
)
){

await signOut(auth);

throw new Error(
"not-admin"
);

}


/* LOGIN SUCCESS */

showAdmin(
user.uid
);

}

catch(error){

console.error(
"ADMIN LOGIN ERROR:",
error
);


if(
error.message ===
"not-admin"
){

errorBox.textContent =
"This account is not authorized as an admin.";

}

else if(
error.code ===
"auth/invalid-credential"
){

errorBox.textContent =
"Incorrect email or password.";

}

else if(
error.code ===
"auth/invalid-email"
){

errorBox.textContent =
"Please enter a valid email address.";

}

else if(
error.code ===
"auth/too-many-requests"
){

errorBox.textContent =
"Too many attempts. Please try again later.";

}

else{

errorBox.textContent =
"Login failed: " +
error.code;

}


errorBox.style.display =
"block";

}

finally{

button.disabled =
false;

button.textContent =
"Login";

}

};



/* =========================================
   SHOW ADMIN
========================================= */

async function showAdmin(uid){

document.getElementById(
"loginView"
).classList.add(
"hidden"
);


document.getElementById(
"adminView"
).classList.remove(
"hidden"
);


/* GET ADMIN NAME */

try{

const snapshot =
await new Promise(
resolve => {

import(
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js"
)

.then(module => {

const userRef =
module.ref(
db,
"users/" + uid
);

module.onValue(
userRef,
snap => resolve(snap),
{
onlyOnce:true
}
);

});

});


const userData =
snapshot.val();


if(
userData &&
userData.role === "admin"
){

document.getElementById(
"adminName"
).textContent =
userData.name ||
"Admin";

}

else{

document.getElementById(
"adminName"
).textContent =
"Admin";

}

}

catch(error){

console.log(error);

}


loadOrders();

}


/* =========================================
   LOGOUT
========================================= */

window.logoutAdmin =
async function(){

try{

await signOut(auth);

}

catch(error){

console.error(error);

}

};



/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
auth,
user => {

if(!user){

document.getElementById(
"loginView"
).classList.remove(
"hidden"
);

document.getElementById(
"adminView"
).classList.add(
"hidden"
);

return;

}


/* CHECK UID */

if(
!ADMIN_UIDS.includes(
user.uid
)
){

signOut(auth);

return;

}


showAdmin(
user.uid
);

});



/* =========================================
   LOAD ORDERS
========================================= */

function loadOrders(){

const ordersRef =
ref(
db,
"orders"
);


onValue(

ordersRef,

snapshot => {

const data =
snapshot.val() || {};


const orders =
Object.entries(data)

.map(
([key,order]) => ({

...order,

key:key

})
)

.sort(
(a,b) =>
new Date(
b.createdAt
) -
new Date(
a.createdAt
)
);


document.getElementById(
"orderCount"
).textContent =
orders.length +
" order(s)";


renderOrders(
orders
);

},

error => {

console.error(
"ORDERS ERROR:",
error
);

document.getElementById(
"orderCount"
).textContent =
"Could not load orders.";

}

);

}


/* =========================================
   RENDER ORDERS
========================================= */

function renderOrders(orders){

const container =
document.getElementById(
"orders"
);


if(!orders.length){

container.innerHTML = `

<div class="order">

No orders yet.

</div>

`;

return;

}


container.innerHTML =
orders.map(

order => `

<div class="order">

<div class="order-title">

📦 ${escapeHtml(
order.id || order.key
)}

</div>


<div class="small">

${escapeHtml(
order.createdAt
?
new Date(
order.createdAt
).toLocaleString()
:
""
)}

</div>


<div class="info">

<b>🛒 Items:</b><br>

${escapeHtml(
order.items || "Not provided"
)}

<br><br>


<b>📍 Pickup:</b><br>

${escapeHtml(
order.pickup || "Not provided"
)}

<br><br>


<b>🏠 Delivery:</b><br>

${escapeHtml(
order.delivery || "Not provided"
)}

<br><br>


<b>👤 Customer:</b>

${escapeHtml(
order.name || "Customer"
)}

<br>


<b>📞 Phone:</b>

${escapeHtml(
order.phone || "Not provided"
)}

<br><br>


<span class="status">

${escapeHtml(
order.status || "New"
)}

</span>


${
order.rider
?
`
<br><br>
<b>🛵 Rider:</b>
${escapeHtml(order.rider)}
`
:
""
}


${
order.note
?
`
<br><br>
<b>📝 Note:</b>
${escapeHtml(order.note)}
`
:
""
}

</div>


<div class="rider-row">

<button
class="secondary"
onclick="acceptOrder(
'${escapeHtml(order.key)}'
)">

Accept Order

</button>


<button
class="primary"
onclick="markDelivered(
'${escapeHtml(order.key)}'
)">

Delivered

</button>

</div>


</div>

`

).join("");

}


/* =========================================
   ACCEPT ORDER
========================================= */

window.acceptOrder =
async function(key){

try{

await update(

ref(
db,
"orders/" + key
),

{
status:"Accepted"
}

);

}

catch(error){

console.error(error);

alert(
"Could not accept order."
);

}

};



/* =========================================
   DELIVERED
========================================= */

window.markDelivered =
async function(key){

try{

await update(

ref(
db,
"orders/" + key
),

{
status:"Delivered"
}

);

}

catch(error){

console.error(error);

alert(
"Could not update order."
);

}

};



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/[&<>'"]/g,

character => ({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"

}[character])

);

}

</script>

</body>

</html>s
