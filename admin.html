<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#0f766e">

<title>Mahebourg Admin</title>

<style>

:root{
  --primary:#0f766e;
  --primary2:#115e59;
  --bg:#f4f7f7;
  --card:#ffffff;
  --text:#16302d;
  --muted:#6b7d7a;
  --border:#dce7e5;
  --green:#16a34a;
  --blue:#2563eb;
  --orange:#ea580c;
  --red:#dc2626;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.app{
  max-width:700px;
  margin:auto;
  min-height:100vh;
}

.header{
  background:linear-gradient(
    135deg,
    var(--primary),
    #159a8c
  );
  color:white;
  padding:22px 18px;
  border-bottom-left-radius:24px;
  border-bottom-right-radius:24px;
}

.brand{
  font-size:13px;
  font-weight:bold;
  opacity:.9;
}

.title{
  font-size:28px;
  font-weight:900;
  margin-top:7px;
}

.sub{
  font-size:13px;
  margin-top:5px;
  opacity:.9;
}

.content{
  padding:15px;
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:17px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.section-title{
  font-size:17px;
  font-weight:900;
  margin-bottom:12px;
}

input,
select{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid var(--border);
  border-radius:11px;
  font-size:15px;
  background:#fbfdfd;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:11px;
  margin-top:7px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

.primary{
  background:var(--primary);
  color:white;
}

.blue{
  background:var(--blue);
  color:white;
}

.green{
  background:var(--green);
  color:white;
}

.orange{
  background:var(--orange);
  color:white;
}

.red{
  background:var(--red);
  color:white;
}

.gray{
  background:#e8f5f3;
  color:var(--primary);
}

.hidden{
  display:none !important;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:11px;
  border-radius:10px;
  font-size:13px;
  margin-top:10px;
}

.success{
  background:#dcfce7;
  color:#166534;
  padding:11px;
  border-radius:10px;
  font-size:13px;
  margin-top:10px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.logout{
  width:auto;
  background:#fee2e2;
  color:#991b1b;
  padding:9px 13px;
  margin:0;
}

.connection{
  padding:10px;
  border-radius:10px;
  background:#fff4d8;
  color:#8a5a00;
  font-size:12px;
  text-align:center;
  margin-bottom:14px;
}

.connection.ready{
  background:#dcfce7;
  color:#166534;
}

.order{
  border:1px solid var(--border);
  border-radius:15px;
  padding:14px;
  margin-top:12px;
  background:#fff;
}

.order-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}

.order-id{
  font-size:17px;
  font-weight:900;
  color:var(--primary);
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#fff4d8;
  color:#8a5a00;
  font-size:11px;
  font-weight:900;
}

.status.accepted{
  background:#dcfce7;
  color:#166534;
}

.status.assigned{
  background:#dbeafe;
  color:#1d4ed8;
}

.status.picked{
  background:#ffedd5;
  color:#c2410c;
}

.status.delivery{
  background:#dbeafe;
  color:#1d4ed8;
}

.status.delivered{
  background:#dcfce7;
  color:#166534;
}

.info{
  font-size:13px;
  line-height:1.55;
  margin-top:12px;
}

.info b{
  color:#374151;
}

.actions{
  margin-top:12px;
}

.actions button{
  margin-top:6px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px;
}

.stat{
  background:white;
  border:1px solid var(--border);
  border-radius:13px;
  padding:12px 8px;
  text-align:center;
}

.stat-number{
  font-size:22px;
  font-weight:900;
  color:var(--primary);
}

.stat-label{
  font-size:10px;
  color:var(--muted);
  margin-top:3px;
}

.small{
  font-size:11px;
  color:var(--muted);
}

.map-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.map-buttons button{
  margin:0;
}

@media(max-width:480px){

  .title{
    font-size:24px;
  }

  .stats{
    grid-template-columns:1fr 1fr 1fr;
  }

  .map-buttons{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>

<div class="app">


<header class="header">

<div class="brand">
MAHEBOURG • GROCERY DELIVERY
</div>

<div class="title">
Admin Dashboard
</div>

<div class="sub">
Manage customer orders and riders
</div>

</header>


<main class="content">


<!-- ================= LOGIN ================= -->

<section
id="loginPage"
class="card">

<div class="section-title">
🔐 Admin Login
</div>

<p class="small">
Login using your Firebase admin email and password.
</p>


<input
id="email"
type="email"
placeholder="Admin Email"
autocomplete="email"
>


<input
id="password"
type="password"
placeholder="Password"
autocomplete="current-password"
>


<button
class="primary"
id="loginButton"
onclick="adminLogin()">

Login to Admin Panel

</button>


<div
id="loginError"
class="error hidden">
</div>

</section>



<!-- ================= DASHBOARD ================= -->

<section
id="dashboard"
class="hidden">


<div class="card">

<div class="topbar">

<div>

<div class="section-title"
style="margin:0">

🛠 Admin Panel

</div>

<div
id="adminEmail"
class="small">
</div>

</div>


<button
class="logout"
onclick="logout()">

Logout

</button>

</div>

</div>


<div
id="connection"
class="connection">

Connecting to Firebase...

</div>


<!-- STATS -->

<div class="stats">

<div class="stat">

<div
id="totalOrders"
class="stat-number">

0

</div>

<div class="stat-label">
TOTAL
</div>

</div>


<div class="stat">

<div
id="newOrders"
class="stat-number">

0

</div>

<div class="stat-label">
NEW
</div>

</div>


<div class="stat">

<div
id="activeOrders"
class="stat-number">

0

</div>

<div class="stat-label">
ACTIVE
</div>

</div>

</div>


<div class="card">

<div class="topbar">

<div class="section-title"
style="margin:0">

📦 Orders

</div>

<button
class="gray"
style="width:auto;margin:0"
onclick="loadOrders()">

🔄 Refresh

</button>

</div>


<div
id="orders">

<div class="small"
style="margin-top:15px">

Loading orders...

</div>

</div>

</div>


</section>


</main>

</div>



<script type="module">


/* =========================================
   FIREBASE IMPORTS
========================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  onValue,
  update
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";



/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyBZzPmYBJNqio_IDrPn6abTVFoci-7GKtI",

  authDomain:
  "delivery-5d936.firebaseapp.com",

  databaseURL:
  "https://delivery-5d936-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
  "delivery-5d936",

  storageBucket:
  "delivery-5d936.firebasestorage.app",

  messagingSenderId:
  "980186352754",

  appId:
  "1:980186352754:web:02785a4144fd6f174746eb",

  measurementId:
  "G-P9ZS24E9Q8"

};



/* =========================================
   INITIALIZE
========================================= */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getDatabase(app);


let ordersListener = null;


/* =========================================
   LOGIN STATE
========================================= */

onAuthStateChanged(
  auth,
  user => {

    if(user){

      showDashboard(
        user
      );

    }

    else{

      showLogin();

    }

  }
);



/* =========================================
   ADMIN LOGIN
========================================= */

async function adminLogin(){

  const email =
    document.getElementById(
      "email"
    ).value.trim();


  const password =
    document.getElementById(
      "password"
    ).value;


  const errorBox =
    document.getElementById(
      "loginError"
    );


  errorBox.classList.add(
    "hidden"
  );


  if(!email || !password){

    showLoginError(
      "Please enter email and password."
    );

    return;

  }


  const button =
    document.getElementById(
      "loginButton"
    );


  button.disabled = true;

  button.textContent =
    "Logging in...";


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }

  catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );


    let message =
      "Login failed.";


    if(
      error.code ===
      "auth/invalid-credential"
    ){

      message =
        "Incorrect email or password.";

    }

    else if(
      error.code ===
      "auth/user-not-found"
    ){

      message =
        "Admin account not found.";

    }

    else if(
      error.code ===
      "auth/wrong-password"
    ){

      message =
        "Incorrect password.";

    }

    else if(
      error.code ===
      "auth/invalid-email"
    ){

      message =
        "Invalid email address.";

    }

    else if(
      error.code ===
      "auth/too-many-requests"
    ){

      message =
        "Too many login attempts. Please wait and try again.";

    }

    else{

      message =
        error.code ||
        "Firebase login error.";

    }


    showLoginError(
      message
    );

  }

  finally{

    button.disabled = false;

    button.textContent =
      "Login to Admin Panel";

  }

}


window.adminLogin =
adminLogin;



/* =========================================
   SHOW LOGIN
========================================= */

function showLogin(){

  document.getElementById(
    "loginPage"
  ).classList.remove(
    "hidden"
  );


  document.getElementById(
    "dashboard"
  ).classList.add(
    "hidden"
  );

}


function showLoginError(message){

  const box =
    document.getElementById(
      "loginError"
    );


  box.textContent =
    "❌ " + message;


  box.classList.remove(
    "hidden"
  );

}



/* =========================================
   SHOW DASHBOARD
========================================= */

function showDashboard(user){

  document.getElementById(
    "loginPage"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "dashboard"
  ).classList.remove(
    "hidden"
  );


  document.getElementById(
    "adminEmail"
  ).textContent =
    user.email || "Admin";


  document.getElementById(
    "connection"
  ).textContent =
    "✓ Firebase connected";


  document.getElementById(
    "connection"
  ).classList.add(
    "ready"
  );


  loadOrders();

}



/* =========================================
   LOGOUT
========================================= */

async function logout(){

  try{

    await signOut(
      auth
    );

  }

  catch(error){

    console.error(error);

  }

}


window.logout =
logout;



/* =========================================
   LOAD ORDERS
========================================= */

function loadOrders(){

  const ordersRef =
    ref(
      db,
      "orders"
    );


  onValue(

    ordersRef,

    snapshot => {

      const data =
        snapshot.val() || {};


      const orders =
        Object.entries(data)

        .map(
          ([key,order]) => ({

            key:key,

            ...order

          })
        )

        .sort(
          (a,b) => {

            return new Date(
              b.createdAt || 0
            )
            -
            new Date(
              a.createdAt || 0
            );

          }
        );


      renderStats(
        orders
      );


      renderOrders(
        orders
      );

    },

    error => {

      console.error(
        "DATABASE ERROR:",
        error
      );


      document.getElementById(
        "connection"
      ).textContent =
        "❌ Database error: " +
        error.code;


      document.getElementById(
        "connection"
      ).classList.remove(
        "ready"
      );

    }

  );

}


window.loadOrders =
loadOrders;



/* =========================================
   STATS
========================================= */

function renderStats(orders){

  const total =
    orders.length;


  const newCount =
    orders.filter(
      o =>
      !o.status ||
      o.status === "New"
    ).length;


  const active =
    orders.filter(
      o =>
      o.status !== "Delivered" &&
      o.status !== "Cancelled"
    ).length;


  document.getElementById(
    "totalOrders"
  ).textContent =
    total;


  document.getElementById(
    "newOrders"
  ).textContent =
    newCount;


  document.getElementById(
    "activeOrders"
  ).textContent =
    active;

}



/* =========================================
   RENDER ORDERS
========================================= */

function renderOrders(orders){

  const container =
    document.getElementById(
      "orders"
    );


  if(!orders.length){

    container.innerHTML = `

      <div class="card">

        <div class="section-title">
          🎉 No orders
        </div>

        <div class="small">
          Customer orders will appear here.
        </div>

      </div>

    `;

    return;

  }


  container.innerHTML =
    orders.map(
      order =>
      createOrderHTML(
        order
      )
    ).join("");

}



/* =========================================
   ORDER CARD
========================================= */

function createOrderHTML(order){

  const status =
    order.status ||
    "New";


  const statusClass =
    getStatusClass(
      status
    );


  const date =
    order.createdAt
    ?
    new Date(
      order.createdAt
    ).toLocaleString()
    :
    "Unknown";


  return `

    <div class="order">

      <div class="order-header">

        <div>

          <div class="order-id">
            📦 ${escapeHtml(order.id || order.key)}
          </div>

          <div class="small">
            ${escapeHtml(date)}
          </div>

        </div>


        <span
          class="status ${statusClass}">

          ${escapeHtml(status)}

        </span>

      </div>


      <div class="info">

        <b>🛒 Grocery Items</b>

        <br>

        ${escapeHtml(
          order.items || "Not provided"
        )}

        <br><br>


        <b>📍 Pickup</b>

        <br>

        ${escapeHtml(
          order.pickup ||
          order.pickupLocation ||
          "Not provided"
        )}

        <br><br>


        <b>🏠 Delivery</b>

        <br>

        ${escapeHtml(
          order.delivery ||
          order.deliveryLocation ||
          "Not provided"
        )}

        <br><br>


        <b>👤 Customer</b>

        <br>

        ${escapeHtml(
          order.name ||
          order.customerName ||
          "Customer"
        )}

        <br>


        <b>📞 Phone</b>

        <br>

        ${escapeHtml(
          order.phone ||
          "Not provided"
        )}

        ${
          order.note
          ?
          `

            <br><br>

            <b>📝 Note</b>

            <br>

            ${escapeHtml(order.note)}

          `
          :
          ""
        }


        ${
          order.rider
          ?
          `

            <br><br>

            <b>🛵 Rider</b>

            <br>

            ${escapeHtml(order.rider)}

          `
          :
          ""

        }

      </div>


      <div class="map-buttons">

        <button
          class="blue"
          onclick="openMap(
            '${encodeURIComponent(
              order.pickup ||
              order.pickupLocation ||
              ""
            )}'
          )">

          📍 Pickup Map

        </button>


        <button
          class="orange"
          onclick="openMap(
            '${encodeURIComponent(
              order.delivery ||
              order.deliveryLocation ||
              ""
            )}'
          )">

          🏠 Delivery Map

        </button>

      </div>


      <div class="actions">


        ${
          status === "New"
          ?

          `

          <button
            class="green"
            onclick="changeStatus(
              '${order.key}',
              'Accepted'
            )">

            ✓ Accept Order

          </button>

          `

          :

          ""

        }


        <select
          onchange="assignRider(
            '${order.key}',
            this.value
          )">

          <option value="">
            🛵 Assign Rider
          </option>

          <option
            value="Rider 1"
            ${order.rider === "Rider 1" ? "selected" : ""}>

            Rider 1

          </option>

          <option
            value="Rider 2"
            ${order.rider === "Rider 2" ? "selected" : ""}>

            Rider 2

          </option>

          <option
            value="Rider 3"
            ${order.rider === "Rider 3" ? "selected" : ""}>

            Rider 3

          </option>

        </select>


        <select
          onchange="changeStatus(
            '${order.key}',
            this.value
          )">

          <option value="">
            Change Status
          </option>

          <option
            value="New"
            ${status === "New" ? "selected" : ""}>

            New

          </option>

          <option
            value="Accepted"
            ${status === "Accepted" ? "selected" : ""}>

            Accepted

          </option>

          <option
            value="Rider Assigned"
            ${status === "Rider Assigned" ? "selected" : ""}>

            Rider Assigned

          </option>

          <option
            value="Picked Up"
            ${status === "Picked Up" ? "selected" : ""}>

            Picked Up

          </option>

          <option
            value="Out for Delivery"
            ${status === "Out for Delivery" ? "selected" : ""}>

            Out for Delivery

          </option>

          <option
            value="Delivered"
            ${status === "Delivered" ? "selected" : ""}>

            Delivered

          </option>

          <option
            value="Cancelled"
            ${status === "Cancelled" ? "selected" : ""}>

            Cancelled

          </option>

        </select>


        <button
          class="gray"
          onclick="callCustomer(
            '${encodeURIComponent(
              order.phone || ""
            )}'
          )">

          📞 Call Customer

        </button>


      </div>

    </div>

  `;

}



/* =========================================
   CHANGE STATUS
========================================= */

async function changeStatus(
  key,
  status
){

  if(!status){

    return;

  }


  try{

    await update(

      ref(
        db,
        "orders/" + key
      ),

      {
        status:status
      }

    );

  }

  catch(error){

    console.error(error);

    alert(
      "Could not change order status.\n\n" +
      error.code
    );

  }

}


window.changeStatus =
changeStatus;



/* =========================================
   ASSIGN RIDER
========================================= */

async function assignRider(
  key,
  rider
){

  if(!rider){

    return;

  }


  try{

    await update(

      ref(
        db,
        "orders/" + key
      ),

      {
        rider:rider,
        status:"Rider Assigned"
      }

    );

  }

  catch(error){

    console.error(error);

    alert(
      "Could not assign rider.\n\n" +
      error.code
    );

  }

}


window.assignRider =
assignRider;



/* =========================================
   OPEN MAP
========================================= */

function openMap(
  location
){

  if(!location){

    alert(
      "Location not available."
    );

    return;

  }


  const decoded =
    decodeURIComponent(
      location
    );


  window.open(

    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(
      decoded
    ),

    "_blank"

  );

}


window.openMap =
openMap;



/* =========================================
   CALL CUSTOMER
========================================= */

function callCustomer(
  phone
){

  const number =
    decodeURIComponent(
      phone
    );


  if(!number){

    alert(
      "Customer phone number not available."
    );

    return;

  }


  window.location.href =
    "tel:" + number;

}


window.callCustomer =
callCustomer;



/* =========================================
   STATUS CLASS
========================================= */

function getStatusClass(
  status
){

  if(status === "Accepted"){

    return "accepted";

  }


  if(status === "Rider Assigned"){

    return "assigned";

  }


  if(status === "Picked Up"){

    return "picked";

  }


  if(status === "Out for Delivery"){

    return "delivery";

  }


  if(status === "Delivered"){

    return "delivered";

  }


  return "";

}



/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /[&<>'"]/g,

    character => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "'":"&#39;",
      '"':"&quot;"

    }[character])

  );

}

</script>

</body>
